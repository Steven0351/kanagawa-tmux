# vim:set ft=tmux:

# Embedded style that ensures that modules look "connected"
# when required.
set -gqF @_ctp_connect_style \
  "#{?#{==:#{@kanagawa_status_connect_separator},yes},,#[bg=default]}"

# There are four colors involved:
#
# - Icon
#   - fg: @kanagawa_status_[module]_icon_fg [default = crust]
#   - bg: @kanagawa_status_[module]_icon_bg [required]
# - Text
#   - fg: @kanagawa_status_[module]_text_fg [default = foreground]
#   - bg: @kanagawa_status_[module]_text_bg [default = @kanagawa_status_module_text_bg]

set -ogqF "@kanagawa_status_${MODULE_NAME}_icon_fg" "#{E:@thm_fg_dark}"
set -ogqF "@kanagawa_status_${MODULE_NAME}_text_fg" "#{E:@thm_fg}"

%if "#{==:#{@kanagawa_status_${MODULE_NAME}_icon_bg},}"
  set -gqF "@kanagawa_status_${MODULE_NAME}_icon_bg" "#{@kanagawa_${MODULE_NAME}_color}"
%endif

%if "#{==:#{@kanagawa_status_${MODULE_NAME}_text_bg},}"
  set -gqF @_ctp_module_text_bg "#{E:@kanagawa_status_module_text_bg}"
%else
  set -gqF @_ctp_module_text_bg "#{@kanagawa_status_${MODULE_NAME}_text_bg}"
%endif

set -gF "@kanagawa_status_${MODULE_NAME}" \
  "#[fg=#{@kanagawa_status_${MODULE_NAME}_icon_bg}]#{@_ctp_connect_style}#{@kanagawa_status_left_separator}"

set -agF "@kanagawa_status_${MODULE_NAME}" \
  "#[fg=#{@kanagawa_status_${MODULE_NAME}_icon_fg},bg=#{@kanagawa_status_${MODULE_NAME}_icon_bg}]#{@kanagawa_${MODULE_NAME}_icon}"

set -agF "@kanagawa_status_${MODULE_NAME}" \
  "#{@kanagawa_status_middle_separator}"

set -agF "@kanagawa_status_${MODULE_NAME}" \
  "#[fg=#{@thm_fg},bg=#{@_ctp_module_text_bg}]"
  # "#[fg=#{@kanagawa_status_${MODULE_NAME}_text_fg},bg=#{@_ctp_module_text_bg}]"

set -ag "@kanagawa_status_${MODULE_NAME}" "#{E:@kanagawa_${MODULE_NAME}_text}"

set -agF "@kanagawa_status_${MODULE_NAME}" "#[fg=#{@_ctp_module_text_bg}]#{@_ctp_connect_style}#{@kanagawa_status_right_separator}"

set -ug @_ctp_connect_style
set -ug @_ctp_module_text_bg
