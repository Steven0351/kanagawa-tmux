source -F "#{d:current_file}/themes/kanagawa_#{@kanagawa_flavor}_tmux.conf"

%if "#{==:#{@kanagawa_status_background},default}"
  set -gF @_ctp_status_bg "#{@thm_bg}"
  set -gF status-style "bg=#{@_ctp_status_bg},fg=#{@thm_fg}"

  %hidden CTP_MESSAGE_BACKGROUND="#{@thm_border}"
%elif "#{==:#{@kanagawa_status_background},none}"
  set -g status-style "default"
  set -g @_ctp_status_bg "none"

  %hidden CTP_MESSAGE_BACKGROUND="default"
%else
  # Treat @kanagawa_status_background as a format string.
  set -gF status-style "bg=#{E:@kanagawa_status_background},fg=#{@thm_fg}"
  set -gF @_ctp_status_bg "#{E:@kanagawa_status_background}"

  %hidden CTP_MESSAGE_BACKGROUND="#{E:@kanagawa_status_background}"
%endif

source -F "#{d:current_file}/status/application.conf"
source -F "#{d:current_file}/status/battery.conf"
source -F "#{d:current_file}/status/clima.conf"
source -F "#{d:current_file}/status/cpu.conf"
source -F "#{d:current_file}/status/date_time.conf"
source -F "#{d:current_file}/status/directory.conf"
source -F "#{d:current_file}/status/gitmux.conf"
source -F "#{d:current_file}/status/host.conf"
source -F "#{d:current_file}/status/kube.conf"
source -F "#{d:current_file}/status/load.conf"
source -F "#{d:current_file}/status/pomodoro_plus.conf"
source -F "#{d:current_file}/status/session.conf"
source -F "#{d:current_file}/status/uptime.conf"
source -F "#{d:current_file}/status/user.conf"
source -F "#{d:current_file}/status/weather.conf"

# messages
set -gF message-style "fg=#{@thm_teal},bg=$CTP_MESSAGE_BACKGROUND,align=centre"
set -gF message-command-style "fg=#{@thm_teal},bg=$CTP_MESSAGE_BACKGROUND,align=centre"

# menu
%if "#{>=:#{version},3.4}"
  set -gF menu-selected-style "#{E:@kanagawa_menu_selected_style}"
%endif

# panes
set -wgF pane-active-border-style "#{E:@kanagawa_pane_active_border_style}"
set -wgF pane-border-style "#{E:@kanagawa_pane_border_style}"

%if "#{==:#{@kanagawa_pane_status_enabled},yes}"
  # "internal" variables are kept as @_ctp_p_.*
  # and then unset at the end.
  set -gq @_ctp_p_left "" # the content on the left, usually a separator
  set -gq @_ctp_p_middle ""
  set -gq @_ctp_p_right ""
  set -gq @_ctp_p_number ""
  set -gq @_ctp_p_text ""

  %if "#{==:#{@kanagawa_pane_default_fill},none}"
    set -g @_ctp_p_left \
      "#[fg=#{@thm_bg_alt},bg=default]#{@kanagawa_pane_left_separator}"
    set -g @_ctp_p_middle \
      "#[fg=#{@thm_fg},bg=#{@thm_bg_alt}]#{@kanagawa_pane_middle_separator}"
    set -g @_ctp_p_right \
      "#[fg=#{@thm_bg_alt},bg=default]#{@kanagawa_pane_right_separator}"

    set -g @_ctp_p_number \
      "#[fg=#{@thm_fg},bg=#{@thm_bg_alt}]##{pane_index}"
    set -g @_ctp_p_text \
      "#[fg=#{@thm_fg},bg=#{@thm_bg_alt}]#{E:@kanagawa_pane_default_text}"

  %elif "#{==:#{@kanagawa_pane_default_fill},all}"

    set -g @_ctp_p_left \
      "#[fg=#{E:@kanagawa_pane_color},bg=default]#{@kanagawa_pane_left_separator}"
    set -g @_ctp_p_middle \
      "#[fg=#{E:@kanagawa_pane_color},bg=#{E:@kanagawa_pane_background_color}]#{@kanagawa_pane_middle_separator}"
    set -g @_ctp_p_right \
      "#[fg=#{E:@kanagawa_pane_color},bg=default]#{@kanagawa_pane_right_separator}"

    set -g @_ctp_p_number \
      "#[fg=#{E:@kanagawa_pane_background_color},bg=#{E:@kanagawa_pane_color}]##{pane_index}"
    set -g @_ctp_p_text \
      "#[fg=#{E:@kanagawa_pane_background_color},bg=#{E:@kanagawa_pane_color}]#{E:@kanagawa_pane_default_text}"

  %elif "#{==:#{@kanagawa_pane_default_fill},number}"

    %if "#{==:#{@kanagawa_pane_number_position},left}"
      set -g @_ctp_p_left \
        "#[fg=#{E:@kanagawa_pane_color},bg=default]#{@kanagawa_pane_left_separator}"
      set -g @_ctp_p_right \
        "#[fg=#{E:@kanagawa_pane_background_color},bg=default]#{@kanagawa_pane_right_separator}"
    %else
      set -g @_ctp_p_left \
        "#[fg=#{E:@kanagawa_pane_background_color},bg=default]#{@kanagawa_pane_left_separator}"
      set -g @_ctp_p_right \
        "#[fg=#{E:@kanagawa_pane_color},bg=default]#{@kanagawa_pane_right_separator}"
    %endif

    set -g @_ctp_p_middle \
      "#[fg=#{E:@kanagawa_pane_color},bg=#{E:@kanagawa_pane_background_color}]#{@kanagawa_pane_middle_separator}"

    set -g @_ctp_p_number \
      "#[fg=#{E:@kanagawa_pane_background_color},bg=#{E:@kanagawa_pane_color}]##{pane_index}"
    set -g @_ctp_p_text \
      "#[fg=#{E:@kanagawa_pane_color},bg=#{E:@kanagawa_pane_background_color}]#{E:@kanagawa_pane_default_text}"

  %endif

  %if "#{==:#{@kanagawa_pane_number_position},left}"
    set -wgF pane-border-format \
      "#{E:@_ctp_p_left}#{E:@_ctp_p_number}#{E:@_ctp_p_middle} #{E:@_ctp_p_text}#{E:@_ctp_p_right}"
  %else
    set -wgF pane-border-format \
      "#{E:@_ctp_p_left}#{E:@_ctp_p_text} #{E:@_ctp_p_middle}#{E:@_ctp_p_number}#{E:@_ctp_p_right}"
  %endif

  set -ug @_ctp_p_left
  set -ug @_ctp_p_middle
  set -ug @_ctp_p_right
  set -ug @_ctp_p_number
  set -ug @_ctp_p_text
%endif

# popups
%if "#{>=:#{version},3.4}"
  set -gF popup-style "bg=#{@thm_bg_alt},fg=#{@thm_fg}"
  set -gF popup-border-style "fg=#{@thm_text_alt_2}"
%endif

%if "#{==:#{@kanagawa_window_status_style},basic}"

  set -gq @kanagawa_window_left_separator " "
  set -gq @kanagawa_window_middle_separator " "
  set -gq @kanagawa_window_right_separator " "

%elif "#{==:#{@kanagawa_window_status_style},rounded}"

  set -gq @kanagawa_window_left_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
  set -gq @kanagawa_window_middle_separator " "
  set -gq @kanagawa_window_right_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"

%elif "#{==:#{@kanagawa_window_status_style},slanted}"

  set -gq @kanagawa_window_left_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"

  %if "#{==:#{@kanagawa_window_number_position},left}"
    set -gq @kanagawa_window_middle_separator "#[fg=#{@kanagawa_window_number_color},bg=#{@kanagawa_window_text_color}]"
    set -gq @kanagawa_window_current_middle_separator \
      "#[fg=#{@kanagawa_window_current_number_color},bg=#{@kanagawa_window_current_text_color}]"
  %else
    set -gq @kanagawa_window_middle_separator " #[fg=#{@kanagawa_window_number_color},bg=#{@kanagawa_window_text_color}]"
    set -gq @kanagawa_window_current_middle_separator \
      " #[fg=#{@kanagawa_window_current_number_color},bg=#{@kanagawa_window_current_text_color}]"
  %endif

  set -gq @kanagawa_window_right_separator "#[fg=#{@_ctp_status_bg},reverse]█#[none]"

%endif

# DO NOT USE -o IN YOUR OWN CONFIGURATION
set -ogqF @kanagawa_window_current_left_separator "#{@kanagawa_window_left_separator}"
set -ogqF @kanagawa_window_current_middle_separator "#{@kanagawa_window_middle_separator}"
set -ogqF @kanagawa_window_current_right_separator "#{@kanagawa_window_right_separator}"

# window status
%if "#{!=:#{@kanagawa_window_status_style},none}"
  set -gF window-status-activity-style "bg=#{@thm_light_purple},fg=#{@thm_fg_dark}"
  set -gF window-status-bell-style "bg=#{@thm_yellow},fg=#{@thm_fg_dark}"

   %if "#{==:#{@kanagawa_window_flags},icon}"
    set -gqF @_ctp_w_flags "#{E:@kanagawa_window_flags_icon_format}"
  %elif "#{==:#{@kanagawa_window_flags},text}"
    set -gq @_ctp_w_flags "#F"
  %else
    set -gq @_ctp_w_flags ""
  %endif

  set -g @_ctp_w_number_style "#[fg=#{@thm_fg_dark},bg=#{@kanagawa_window_number_color}]"
  set -g @_ctp_w_text_style "#[fg=#{@thm_fg},bg=#{@kanagawa_window_text_color}]"
  %if "#{==:#{@kanagawa_window_number_position},left}"
    set -gF window-status-format \
      "#{E:@_ctp_w_number_style}#{E:@kanagawa_window_left_separator}#{@kanagawa_window_number}"
    set -agF window-status-format "#{E:@kanagawa_window_middle_separator}"
    set -agF window-status-format \
      "#{E:@_ctp_w_text_style}#{@kanagawa_window_text}#{@_ctp_w_flags}#{E:@kanagawa_window_right_separator}"
  %else
    set -gF window-status-format \
      "#{E:@_ctp_w_text_style}#{E:@kanagawa_window_left_separator}#{E:@_ctp_w_text_style}#{@kanagawa_window_text}#{@_ctp_w_flags}"
    set -agF window-status-format "#{E:@kanagawa_window_middle_separator}"
    set -agF window-status-format \
      "#{E:@_ctp_w_number_style} #{@kanagawa_window_number}#{E:@kanagawa_window_right_separator}"
  %endif

  # =======================================
  # And do the same for the current window.
  # =======================================

  set -g @_ctp_w_number_style "#[fg=#{@thm_fg_dark},bg=#{@kanagawa_window_current_number_color}]"
  set -g @_ctp_w_text_style "#[fg=#{@thm_fg},bg=#{@kanagawa_window_current_text_color}]"
  %if "#{==:#{@kanagawa_window_number_position},left}"
    set -gF window-status-current-format \
      "#{E:@_ctp_w_number_style}#{E:@kanagawa_window_current_left_separator}#{@kanagawa_window_current_number}"
    set -agF window-status-current-format "#{E:@kanagawa_window_current_middle_separator}"
    set -agF window-status-current-format \
      "#{E:@_ctp_w_text_style}#{@kanagawa_window_current_text}#{@_ctp_w_flags}#{E:@kanagawa_window_current_right_separator}"
  %else
    set -gF window-status-current-format \
      "#{E:@_ctp_w_text_style}#{E:@kanagawa_window_current_left_separator}#{E:@_ctp_w_text_style}#{@kanagawa_window_current_text}#{@_ctp_w_flags}"
    set -agF window-status-current-format "#{E:@kanagawa_window_current_middle_separator}"
    set -agF window-status-current-format \
      "#{E:@_ctp_w_number_style} #{@kanagawa_window_current_number}#{E:@kanagawa_window_current_right_separator}"
  %endif


  # Cleanup (unset) all of the internal variables.
  set -ug @_ctp_w_number_style
  set -ug @_ctp_w_text_style
  set -ug @_ctp_w_flags
%endif

# Mode style. This is used for copy mode highlighting to style the current selection.
set -gF mode-style "bg=#{@thm_bg_alt},bold"
set -gF clock-mode-colour "#{@thm_dark_blue}"
